name: DeFilEnAiguille
options:
  bundleIdPrefix: fr.thibbal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: LU5WXR422M
    CODE_SIGN_STYLE: Automatic
targets:
  DeFilEnAiguille:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.thibbal.defilenaiguille
        PRODUCT_NAME: DeFilEnAiguille
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "De fil en aiguille"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.trivia-games
        INFOPLIST_KEY_UIAppFonts: ""
    info:
      path: Sources/Info.plist
      properties:
        UIAppFonts:
          - InstrumentSerif_400Regular.ttf
          - InstrumentSerif_400Regular_Italic.ttf
          - HankenGrotesk_400Regular.ttf
          - HankenGrotesk_500Medium.ttf
          - HankenGrotesk_600SemiBold.ttf
        CFBundleDisplayName: De fil en aiguille
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
