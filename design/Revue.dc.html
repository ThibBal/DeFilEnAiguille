<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Revue d'un questionnaire</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
[data-theme]{--paper:#F6F3EC;--ink:#1D1B18;--muted:#6B665C;--card:#FBF9F4;--border:#D9D3C6;--hair:#E2DCCF;--accent:#B5371F;--accent-soft:#F6E3DB;--ring:#F0D9D0;--wrong-bg:#ECE7DC;--wrong-ink:#4F4B43;--dim-border:#E5E0D4;--dot-off:#8A8477;--seg:#CFC8B9;--body:#3A372F}
[data-theme="dark"]{--paper:#171612;--ink:#F2EEE5;--muted:#A39D90;--card:#201E19;--border:#3A362E;--hair:#2B2923;--accent:#E4694F;--accent-soft:#3A211B;--ring:#4A2A22;--wrong-bg:#2A2822;--wrong-ink:#C9C3B6;--dim-border:#2B2923;--dot-off:#7C7669;--seg:#4A463D;--body:#D8D3C7}
body{margin:0}
.back,.tab{text-decoration:none}
.back:focus-visible,.tab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--dot-off);background:transparent}
.dot[data-on="yes"]{background:var(--accent);border-color:var(--accent)}
.knot{width:14px;height:14px;border-radius:50%;box-sizing:border-box;flex:none}
.knot[data-state="right"]{background:var(--accent);border:2px solid var(--accent)}
.knot[data-state="wrong"]{background:var(--muted);border:2px solid var(--muted)}
.vseg{flex:1;width:0;min-height:22px;border-left:2px solid var(--accent);margin:4px 0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:1;min-height:60px;font-size:12px;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
</style>
</helmet>
<div data-theme="{{ theme }}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: 'Hanken Grotesk', system-ui, sans-serif; overflow: hidden">

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 24px 24px">

    <a class="back" href="Historique.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: var(--ink); font-size: 15px; font-weight: 500">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Historique
    </a>

    <p style="margin: 20px 0 0; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Samedi 10 octobre</p>
    <h1 style="margin: 8px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; font-size: 38px; line-height: 1.08; text-wrap: balance">De la soie à Marco Polo</h1>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 16px">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; line-height: 1">4 sur 5</span>
      <div role="img" aria-label="4 bonnes réponses sur 5" style="display: flex; gap: 5px">
        <span class="dot" data-on="yes"></span>
        <span class="dot" data-on="yes"></span>
        <span class="dot" data-on="no"></span>
        <span class="dot" data-on="yes"></span>
        <span class="dot" data-on="yes"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; margin-top: 32px">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
        <div style="display: flex; align-items: stretch; gap: 16px">
          <div style="display: flex; flex-direction: column; align-items: center; width: 14px; flex: none; padding-top: 3px">
            <span class="knot" data-state="{{ it.state }}"></span>
            <sc-if value="{{ it.hasSeg }}" hint-placeholder-val="{{ true }}">
              <span class="vseg"></span>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; padding-bottom: 28px">
            <p style="margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Question {{ it.n }}</p>
            <p style="margin: 6px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 23px; line-height: 1.2; text-wrap: balance">{{ it.q }}</p>
            <sc-if value="{{ it.ok }}" hint-placeholder-val="{{ true }}">
              <p style="margin: 10px 0 0; font-size: 16px; line-height: 1.35">{{ it.right }} <span style="color: var(--muted); font-size: 14px">· bonne réponse</span></p>
            </sc-if>
            <sc-if value="{{ it.ko }}" hint-placeholder-val="{{ false }}">
              <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 16px; line-height: 1.35">
                <p style="margin: 0"><span style="color: var(--muted); font-size: 14px">Votre réponse · </span><span style="text-decoration: line-through; color: var(--wrong-ink)">{{ it.mine }}</span></p>
                <p style="margin: 0"><span style="color: var(--muted); font-size: 14px">Bonne réponse · </span>{{ it.right }}</p>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>

  </div>

  <nav aria-label="Navigation principale" style="flex: none; display: flex; border-top: 1px solid var(--hair); background: var(--paper); padding-bottom: 6px">
    <a class="tab" href="Main.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Aujourd'hui</span>
    </a>
    <a class="tab" href="Historique.dc.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
      <span>Historique</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { q: "Quel insecte produit le fil de soie ?", right: "Le ver à soie", mine: null },
      { q: "Dans quel pays la production de soie est-elle née ?", right: "La Chine", mine: "L'Inde" },
      { q: "Comment nomme-t-on le réseau de routes qui reliait la Chine à l'Europe ?", right: "La route de la soie", mine: null },
      { q: "Quel marchand vénitien a rejoint la Chine au XIIIe siècle ?", right: "Marco Polo", mine: null },
      { q: "Quel livre raconte son voyage ?", right: "Le Devisement du monde", mine: null }
    ];
    const items = data.map((d, i) => {
      const ok = d.mine === null;
      return { n: i + 1, q: d.q, right: d.right, mine: d.mine, ok, ko: !ok, state: ok ? "right" : "wrong", hasSeg: i < 4 };
    });
    return { items, theme: this.props.dark ? "dark" : "light" };
  }
}
</script>
</body>
</html>
